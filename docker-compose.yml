name: rickard-portfolio

services:
  rickard-portfolio:
    build:
      context: .
    image: rickard-portfolio:local
    container_name: rickard-portfolio
    restart: unless-stopped
    ports:
      # Loopback only: reachable through the Synology reverse proxy, not from the LAN.
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
    # The runtime image is node:22-alpine: it ships busybox wget, not curl.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
